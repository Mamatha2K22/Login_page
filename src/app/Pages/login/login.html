<div class="page-wrapper">
  <h4>
    Cy<span style="color:crimson">monix</span>IQ
  </h4>

  <!-- Login Form -->
  <form *ngIf="isLoginview; else registerpg" [formGroup]="loginForm">
    <p class="form-title">SignIn</p>
    <h5>Welcome Back</h5>

    <!--<div class="form-group">
      <div class="form-field">-->
        <label for="email" class="input-label">Email<span class="required">*</span></label>
        <!--<input id="email" formControlName="email" type="email" />-->
        <input id="email" type="email" pInputText formControlName="email"  />

     <!-- </div>
    </div>
    <div class="form-group">
      <div class="form-field">-->
        <label for="password" class="input-label">Password <span class="required">*</span></label>
        <!--<input id="password" formControlName="password" type="password" />-->
        <p-password id="password" type="password" formControlName="password" [feedback]="false"  />
      <!--</div>
    </div>-->


    <div class="form-group">
     <!-- <button type="button" (click)="onLogin()">Sign In</button>-->
      <p-button
  label="SignIn"
  variant="text"
  [raised]="true"
  severity="secondary"
  [ngStyle]="loginForm.valid ? {
    'background-color': 'green',
    'box-shadow': '0 0 10px #00ff00',
    'border-radius': '6px'
  } : {}"
  (click)="onLogin()"
/>
    </div>
    <div class="form-group">
      <p>
        Don't have an account?
        <span class="signup-link" (click)="isLoginview = false">Sign Up</span>
      </p>
    </div>
  </form>

  <!-- Register Form -->
  <ng-template #registerpg>
    <form [formGroup]="registerForm">
      <p class="form-title">SignUp</p>

     <!-- <div class="form-group">
        <div class="form-field">
          <label for="name" class="input-label">Name</label>
          <input id="name" formControlName="name" type="text" placeholder="Name" />
        </div>
      </div>-->
      
       <label for="name">Username</label>
       <input id="name" type="text" pInputText formControlName="name"  />
        
    
    

      <!--<div class="form-group">
        <div class="form-field">
          <label for="email" class="input-label">Email</label>
          <input id="email" formControlName="email" type="email" placeholder="email" />
        </div>
      </div>-->
    
        
    
  

    
    

      <label for="email">Email</label>
      <input id="email" type="email" pInputText formControlName="email"  />
      <!-- <div class="form-group">
        <div class="form-field">
          <label for="password" class="input-label">Password</label>
          <input id="password" formControlName="password" type="password" />
        </div>
      </div>-->
      <div></div>
      <label for="password">Password</label>
      <p-password formControlName="password"  autocomplete="off" inputId="password" type="password" fluid  >
        
    
        <ng-template #footer>
          <p-divider />
          <ul class="pl-2 my-0 leading-normal">
            <li>At least one lowercase</li>
            <li>At least one uppercase</li>
            <li>At least one numeric</li>
            <li>Minimum 8 characters</li>
          </ul>
        </ng-template>
        
      </p-password>

      


     
     
       

      
      
      

   <!-- <div class="form-group">
      <div class="form-field">
        <label for="confirm_password" class="input-label">Confirm Password</label>
        <input id="confirm_password" formControlName="confirm_password" type="password" />
      </div>
    </div>-->
    <label for="confirm_password">Confirm Password</label>
    <p-password type="password" formControlName="confirm_password" [feedback]="false"  />


    <!--Date Picker-->

        <label for="cheese">MM-DD-YYYY</label>
        <p-radiobutton name="ingredient" value="mm-dd-yy" formControlName="ingredient" inputId="cheese" />
        
        <label for="mushroom">DD-MM-YYYY</label>
        <p-radiobutton name="ingredient" value="dd-mm-yy" formControlName="ingredient" inputId="mushroom" />
        

        <p-datepicker formControlName="date2" [dateFormat]="dateFormat" [iconDisplay]="'input'" 
        [showIcon]="true" inputId="icondisplay" />

         <div *ngFor="let subject of subjects">
  <div class="flex items-center gap-2">
    <!-- Checkbox -->
    <p-checkbox
      [inputId]="subject" [formControlName]="subject" [binary]="true"
    ></p-checkbox>

    <!-- Label outside -->
    <label [for]="subject">{{ subject | titlecase }}</label>
  </div>
    

     <div *ngIf="registerForm.get(subject)?.value">
    <label>Rate your experience in {{ subject | titlecase }}</label>
    <p-autoComplete
      [formControlName]="subject + 'Rating'" [suggestions]="filteredRatings[subject] || []"
      (completeMethod)="search($event, subject)" [dropdown]="true"
    ></p-autoComplete>

    <!-- Validation Message for rating -->
     <!-- Field-level validation-->
    <!--<p-message
      severity="error"
      text="Please provide a rating for {{ subject }}"
      *ngIf="formSubmitted && !registerForm.get(subject + 'Rating')?.value"
    ></p-message>-->
  </div>
</div>

 <!-- <p-message
    severity="error"
    text="Please select at least one subject"
    *ngIf="formSubmitted && !isAtLeastOneSubjectSelected()"
  ></p-message>-->
   

    
    <div class="form-group">
      <!-- <button type="button" (click)="onRegister()">Register</button>-->
       <p-button
  label="Register"
  variant="text"
  [raised]="true"
  severity="secondary"
  [ngStyle]="registerForm.valid ? {
    'background-color': 'blue',
    'box-shadow': '0 0 10px #007bff',
    'border-radius': '6px'
  } : {}"
  (click)="onRegister()"
/>

    </div>
    <div class="form-group">
      <p>
        Already have an account?
        <span class="signin-link" (click)="isLoginview = true">Sign In</span>
      </p>
    </div>
    </form>
  </ng-template>
</div>
