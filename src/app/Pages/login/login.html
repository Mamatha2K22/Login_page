<div class="login-container">

  <!-- Login Form -->
  <form *ngIf="isLoginview; else registerpg" [formGroup]="loginForm">
    <h2>Login</h2>
    <div class="form-group">
      <input formControlName="email" type="email" placeholder="Email" />
    </div>
    <div class="form-group">
      <input formControlName="password" type="password" placeholder="Password" />
    </div>
    <button type="button" (click)="onLogin()">Login</button>
    <p>
      Don't have an account? 
      <span class="highlighted" (click)="isLoginview = false">Register</span>
    </p>
  </form>

  <!-- Register Form using ng-container -->
  <ng-template #registerpg>
    <div>
      <form [formGroup]="registerForm">
        <h2>Register</h2>
        <div class="form-group">
          <input formControlName="name" type="text" placeholder="Name" />
        </div>
        <div class="form-group">
          <input formControlName="email" type="email" placeholder="Email" />
        </div>
        <div class="form-group">
          <input formControlName="password" type="password" placeholder="Password" />
        </div>
        <button type="button" (click)="onRegister()">Register</button>
        <p>
          Already have an account? 
          <span class="highlighted" (click)="isLoginview = true">Login</span>
        </p>
      </form>
    </div>
  </ng-template>

</div>
