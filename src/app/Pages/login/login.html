<div class="page-wrapper">
  <h4>
    Cy<span style="color:crimson">monix</span>IQ
  </h4>

  <!-- Login Form -->
  <form *ngIf="isLoginview; else registerpg" [formGroup]="loginForm">
    <p class="form-title">SignIn</p>
    <h5>Welcome Back</h5>

    <div class="form-group">
      <div class="form-field">
        <label for="email" class="input-label">Email<span class="required">*</span></label>
        <input id="email" formControlName="email" type="email" />
      </div>
    </div>
    <div class="form-group">
      <div class="form-field">
        <label for="password" class="input-label">Password <span class="required">*</span></label>
        <input id="password" formControlName="password" type="password" />
      </div>
    </div>

    <div class="form-group">
      <button type="button" (click)="onLogin()">Sign In</button>
    </div>
    <div class="form-group">
      <p>
        Don't have an account?
        <span class="signup-link" (click)="isLoginview = false">Sign Up</span>
      </p>
    </div>
  </form>

  <!-- Register Form -->
  <ng-template #registerpg>
    <form [formGroup]="registerForm">
      <p class="form-title">SignUp</p>

      <div class="form-group">
        <div class="form-field">
          <label for="name" class="input-label">Name</label>
          <input id="name" formControlName="name" type="text" placeholder="Name" />
        </div>
      </div>
      <div class="form-group">
        <div class="form-field">
          <label for="email" class="input-label">Email</label>
          <input id="email" formControlName="email" type="email" />
        </div>
      </div>
      <div class="form-group">
        <div class="form-field">
          <label for="password" class="input-label">Password</label>
          <input id="password" formControlName="password" type="password" />
        </div>
      </div>
      <div class="form-group">
        <button type="button" (click)="onRegister()">Register</button>
      </div>
      <div class="form-group">
        <p>
          Already have an account?
          <span class="signin-link" (click)="isLoginview = true">Sign In</span>
        </p>
      </div>
    </form>
  </ng-template>
</div>
