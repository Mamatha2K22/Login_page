

<div class="grid-container">
  <div class="search-box">
    <input type="text" [(ngModel)]="searchId" (input)="onSearch()" placeholder="Search Id"><br/><br/>
    <button [routerLink]="['/home']">HomePage</button>
  </div>

  

 
  <div class="card" *ngFor="let item of filterSearch">

    <mat-icon class="card-icon" (click)="onDelete(item)">delete</mat-icon>
    
      
<h2>{{ item.userId  }}</h2>
<hr />
    <p>{{ item.body  }}</p>
    
  </div>
</div>
