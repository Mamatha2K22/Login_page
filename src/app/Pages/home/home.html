
<p-toast/>
<p-confirmDialog></p-confirmDialog>
<p-table 
  [value]="userList" 
  selectionMode="single" 
  [(selection)]="selectedRow" 
  dataKey="id"
  (onRowSelect)="onRowSelect($event)"
  [tableStyle]="{'min-width': '50rem'}"
  [showGridlines]="true" 
  [stripedRows]="false"
>
    <ng-template #header>
        <tr>
            
            <th>Id</th>
            <th>User Id</th>
            <th>Title</th>
            <th>Body</th>
            <th>Action</th>
        </tr>
        </ng-template>
        
        <ng-template  #body let-item>
            <!--<tr *ngFor="let item of userList; let i=index " >-->
                <tr [pSelectableRow]="item">
                
                 <td>{{item.id}}</td>
                <td>{{item.userId}}</td>
                <td>{{item.title}}</td>
                <td>{{item.body}}</td>
                <td><p-button icon= "pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteProduct(item)" ></p-button></td>
            </tr>
        </ng-template>
    
    
    
</p-table>
